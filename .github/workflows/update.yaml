name: Update bonds data
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "7 18 * * *"

jobs:
  update_bonds_data:
    name: Update bonds data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the data repository
        uses: actions/checkout@v6
        with:
          path: data
          sparse-checkout: |
            data/*/*/*_metadata.json
            html_table_generator.py
          sparse-checkout-cone-mode: false

      - name: Checkout the parser repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/polish-retail-bonds-parser
          path: parser

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: parser/.python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Cache bond PDFs
        uses: actions/cache@v5
        with:
          path: pdf-cache
          key: pdf-cache

      - name: Update bonds data
        run: uv run --project parser --frozen polish-retail-bonds --bond-pdf-cache pdf-cache --file-tree data/data

      - name: Update HTML data tables
        working-directory: data
        run: python html_table_generator.py

      - name: Check git status
        working-directory: data
        run: git status

      - name: Configure Git user
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage changes
        id: stage-changes
        working-directory: data
        run: |
          git add --sparse data
          if git diff --staged --quiet; then
            echo HAS_CHANGES=0 >> "$GITHUB_OUTPUT"
          else
            echo HAS_CHANGES=1 >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        working-directory: data
        env:
          BRANCH_NAME: automated/${{ github.run_id }}/update-bonds-data
        if: steps.stage-changes.outputs.HAS_CHANGES == 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add --sparse data
          git commit -m "Update with data from dataset fetched on $(date +'%Y-%m-%d')"
          git push -u origin "$BRANCH_NAME"

      - name: Generate a PR
        working-directory: data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.stage-changes.outputs.HAS_CHANGES == 1
        run: |
          PR_BODY=$'This is an automated PR.\nShort stat:\n```\n'
          PR_BODY+=$(git show --shortstat)
          PR_BODY+=$'\n```\n'

          table=$(git diff -U1 data/table_early_redemption_costs.html | tail -n +7 | head -2 | cut -c 2-)
          if [[ -n "$table" ]]; then
            PR_BODY+=$'Early redemption costs:\n<table>\n'
            PR_BODY+="$table"
            PR_BODY+=$'\n</table>\n'
          fi
          TABLE2=$(git diff -U1 data/table_initial_rates.html | tail -n +7 | head -2 | cut -c 2-)
          if [[ -n "$TABLE2" ]]; then
            PR_BODY+=$'Initial rates:\n<table>\n'
            PR_BODY+="$TABLE2"
            PR_BODY+=$'\n</table>\n'
          fi

          PR_URL=$(
            gh pr create \
              --fill \
              --base "$GITHUB_REF_NAME" \
              --body "$PR_BODY" \
              --label 'automated pr'
          )
          echo "-   Created a PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge the PR
        working-directory: data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.stage-changes.outputs.HAS_CHANGES == 1
        run: |
          gh pr merge --squash
          echo "-   Squash merged the PR" >> "$GITHUB_STEP_SUMMARY"
